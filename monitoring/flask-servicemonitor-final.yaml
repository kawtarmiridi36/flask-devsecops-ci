apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: flask-devsecops-monitor
  namespace: monitoring
  labels:
    release: prometheus-stack
spec:
  selector:
    matchLabels:
      app: flask-devsecops
  namespaceSelector:
    matchNames:
    - production
  endpoints:
  - port: metrics  # Use the named port
    path: /metrics
    interval: 30s
    scrapeTimeout: 10s
    scheme: http
