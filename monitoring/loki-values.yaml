loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: 'filesystem'
  schemaConfig:
    configs:
      - from: 2020-10-24
        store: boltdb-shipper
        object_store: filesystem
        schema: v11
        index:
          prefix: index_
          period: 24h

promtail:
  enabled: true

grafana:
  enabled: false  # We already have Grafana
  sidecar:
    datasources:
      enabled: true

# If you want to use persistent storage (recommended for production)
# persistence:
#   enabled: true
#   accessModes:
#   - ReadWriteOnce
#   size: 10Gi
