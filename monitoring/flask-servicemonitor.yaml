# monitoring/flask-servicemonitor.yaml
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: flask-devsecops-monitor
  namespace: monitoring
  labels:
    release: prometheus-stack  # This label is IMPORTANT for Helm
spec:
  selector:
    matchLabels:
      app: flask-devsecops  # This must match your Flask service labels
  namespaceSelector:
    matchNames:
    - production  # Your Flask app namespace
  endpoints:
  - port: http
    path: /metrics
    interval: 30s
    scrapeTimeout: 10s
    scheme: http
    honorLabels: true
    relabelings:
    - sourceLabels: [__address__]
      targetLabel: instance
