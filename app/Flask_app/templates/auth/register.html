<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription - App Annonces</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h4 class="text-center">📝 Inscription</h4>
                    </div>
                    <div class="card-body">
                        <form id="registerForm">
                            <div class="mb-3">
                                <label for="username" class="form-label">Nom d'utilisateur</label>
                                <input type="text" class="form-control" id="username" required minlength="3">
                                <div class="form-text">Minimum 3 caractères alphanumériques</div>
                            </div>
                            <div class="mb-3">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" class="form-control" id="email" required>
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">Mot de passe</label>
                                <input type="password" class="form-control" id="password" required minlength="6">
                                <div class="form-text">Minimum 6 caractères</div>
                            </div>
                            <button type="submit" class="btn btn-success w-100">S'inscrire</button>
                        </form>
                        <div class="mt-3 text-center">
                            <a href="/auth/login">Déjà un compte ? Se connecter</a>
                        </div>
                        <div id="message" class="mt-3"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            try {
                const response = await fetch('/auth/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ username, email, password })
                });
                
                // Gestion spéciale des erreurs
                if (!response.ok) {
                    const text = await response.text();
                    let errorMessage = 'Erreur serveur';
                    
                    try {
                        const data = JSON.parse(text);
                        errorMessage = data.error || 'Erreur inconnue';
                    } catch {
                        errorMessage = text || 'Réponse invalide du serveur';
                    }
                    
                    throw new Error(errorMessage);
                }
                
                const data = await response.json();
                
                document.getElementById('message').innerHTML = 
                    '<div class="alert alert-success">Inscription réussie! Redirection vers la connexion...</div>';
                setTimeout(() => {
                    window.location.href = '/auth/login';
                }, 2000);
                
            } catch (error) {
                console.error('Erreur détaillée:', error);
                document.getElementById('message').innerHTML = 
                    `<div class="alert alert-danger">Erreur: ${error.message}</div>`;
            }
        });
    </script>
</body>
</html>
