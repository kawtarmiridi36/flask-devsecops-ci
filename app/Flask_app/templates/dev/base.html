<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interface Développeur - App Annonces</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .sidebar { 
            min-height: 100vh; 
            background: linear-gradient(135deg, #2c3e50 0%, #3498db 100%);
        }
        .nav-link { 
            color: #ecf0f1; 
            border-radius: 5px;
            margin: 2px 0;
        }
        .nav-link:hover { 
            background: rgba(255,255,255,0.1); 
            color: #3498db;
        }
        .main-content {
            background: #f8f9fa;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <nav class="col-md-3 col-lg-2 d-md-block sidebar">
                <div class="position-sticky pt-3">
                    <div class="text-center mb-4">
                        <h4 class="text-white">🛠️ Dev Interface</h4>
                        <small class="text-light">App Annonces</small>
                    </div>
                    <ul class="nav flex-column">
                        <li class="nav-item">
                            <a class="nav-link active" href="/dev">
                                📊 Dashboard
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/dev/api/users" target="_blank">
                                👥 Utilisateurs
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/dev/api/annonces" target="_blank">
                                📢 Annonces
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/dev/api/stats" target="_blank">
                                📈 Statistiques
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/dev/api/db-info" target="_blank">
                                🗃️ Base de données
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/health" target="_blank">
                                ❤️ Santé App
                            </a>
                        </li>
                    </ul>
                </div>
            </nav>

            <!-- Main content -->
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4 main-content">
                {% block content %}{% endblock %}
            </main>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
