<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Annonces - App Annonces</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/annonces">�� App Annonces</a>
            <div class="navbar-nav ms-auto">
                <span class="navbar-text me-3" id="userInfo"></span>
                <button class="btn btn-outline-light btn-sm" onclick="logout()">Déconnexion</button>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <!-- Formulaire de création d'annonce -->
        <div class="card mb-4">
            <div class="card-header">
                <h5>➕ Créer une annonce</h5>
            </div>
            <div class="card-body">
                <form id="annonceForm">
                    <div class="mb-3">
                        <label for="titre" class="form-label">Titre</label>
                        <input type="text" class="form-control" id="titre" required minlength="5">
                    </div>
                    <div class="mb-3">
                        <label for="contenu" class="form-label">Contenu</label>
                        <textarea class="form-control" id="contenu" rows="3" required minlength="10"></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">Publier</button>
                </form>
            </div>
        </div>

        <!-- Liste des annonces -->
        <div id="annoncesList">
            <div class="text-center">
                <div class="spinner-border" role="status">
                    <span class="visually-hidden">Chargement...</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentUser = null;

        // Vérifier si l'utilisateur est connecté
        async function checkAuth() {
            try {
                const response = await fetch('/auth/me');
                if (response.ok) {
                    currentUser = await response.json();
                    document.getElementById('userInfo').textContent = `👋 ${currentUser.username}`;
                    loadAnnonces();
                } else {
                    window.location.href = '/auth/login';
                }
            } catch (error) {
                window.location.href = '/auth/login';
            }
        }

        // Charger les annonces
        async function loadAnnonces() {
            try {
                const response = await fetch('/annonces/');
                const annonces = await response.json();
                
                let html = '<h4 class="mb-4">📢 Dernières annonces</h4>';
                
                if (annonces.length === 0) {
                    html += '<div class="alert alert-info">Aucune annonce pour le moment. Soyez le premier à poster !</div>';
                }
                
                annonces.forEach(annonce => {
                    html += `
                    <div class="card mb-3">
                        <div class="card-body">
                            <h5 class="card-title">${annonce.titre}</h5>
                            <p class="card-text">${annonce.contenu}</p>
                            <div class="d-flex justify-content-between align-items-center">
                                <small class="text-muted">
                                    Par ${annonce.auteur} • ${new Date(annonce.date).toLocaleDateString()}
                                </small>
                                <span class="badge bg-secondary">${annonce.commentaires_count} commentaires</span>
                            </div>
                            
                            <!-- Commentaires -->
                            <div class="mt-3">
                                <h6>💬 Commentaires :</h6>
                                ${annonce.commentaires.map(comment => `
                                    <div class="border-start border-3 ps-2 mb-2">
                                        <small><strong>${comment.auteur}</strong>: ${comment.contenu}</small>
                                        <br>
                                        <small class="text-muted">${new Date(comment.date).toLocaleDateString()}</small>
                                    </div>
                                `).join('')}
                                
                                <!-- Formulaire de commentaire -->
                                <form class="mt-2" onsubmit="addComment(event, ${annonce.id})">
                                    <div class="input-group">
                                        <input type="text" class="form-control" placeholder="Ajouter un commentaire..." required>
                                        <button class="btn btn-outline-primary" type="submit">Commenter</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>`;
                });
                
                document.getElementById('annoncesList').innerHTML = html;
            } catch (error) {
                document.getElementById('annoncesList').innerHTML = 
                    '<div class="alert alert-danger">Erreur lors du chargement des annonces</div>';
            }
        }

        // Créer une annonce
        document.getElementById('annonceForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const titre = document.getElementById('titre').value;
            const contenu = document.getElementById('contenu').value;
            
            try {
                const response = await fetch('/annonces/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ titre, contenu })
                });
                
                if (response.ok) {
                    document.getElementById('titre').value = '';
                    document.getElementById('contenu').value = '';
                    loadAnnonces();
                } else {
                    const data = await response.json();
                    alert('Erreur: ' + data.error);
                }
            } catch (error) {
                alert('Erreur de connexion');
            }
        });

        // Ajouter un commentaire
        async function addComment(event, annonceId) {
            event.preventDefault();
            const input = event.target.querySelector('input');
            const contenu = input.value;
            
            try {
                const response = await fetch('/comments/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ contenu, annonce_id: annonceId })
                });
                
                if (response.ok) {
                    input.value = '';
                    loadAnnonces();
                } else {
                    const data = await response.json();
                    alert('Erreur: ' + data.error);
                }
            } catch (error) {
                alert('Erreur de connexion');
            }
        }

        // Déconnexion
        async function logout() {
            try {
                await fetch('/auth/logout', { method: 'POST' });
                window.location.href = '/auth/login';
            } catch (error) {
                window.location.href = '/auth/login';
            }
        }

        // Au chargement de la page
        checkAuth();
    </script>
</body>
</html>
