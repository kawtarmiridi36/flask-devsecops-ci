name: CI Pipeline DevSecOps

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

# Minimal default permissions (fixes Checkov CKV_GHA_1)
permissions:
  contents: read

jobs:
  lint-test:
    name: Lint et Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest

      - name: Linting avec Flake8
        run: |
          flake8 app/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 app/ --count --exit-zero --max-complexity=10 --statistics

      - name: Tests unitaires
        run: |
          python -m pytest tests/ -v || echo "Aucun test trouvé - à implémenter"

  security-sast:
    name: Analyse SAST
    runs-on: ubuntu-latest
    needs: lint-test

    # CodeQL uploads security results => needs this permission.
    # This is safe because CodeQL steps run only on push.
    permissions:
      contents: read
      security-events: write
      actions: read  # ADDED: Fixes the telemetry error

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: SAST avec Bandit
        run: |
          python -m pip install --upgrade pip
          pip install bandit
          bandit -r app/ -f json -o bandit-report.json || true

      # ✅ Correct CodeQL sequence: init -> autobuild -> analyze (ONLY on push)
      - name: Initialize CodeQL
        if: ${{ github.event_name == 'push' }}
        uses: github/codeql-action/init@v3
        with:
          languages: python

      - name: Autobuild
        if: ${{ github.event_name == 'push' }}
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        if: ${{ github.event_name == 'push' }}
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:python"  # ADDED: Optional but good practice

  dependency-check:
    name: Analyse Dépendances
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Scan dépendances avec pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          pip-audit -r requirements.txt || echo "pip-audit terminé"

      # Often fails on private repos if dependency graph isn't enabled.
      - name: Dependabot auto-check (Dependency Review)
        if: ${{ github.event_name == 'pull_request' }}
        continue-on-error: true
        uses: actions/dependency-review-action@v3

  iac-check:
    name: Analyse Infrastructure as Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Checkov pour IaC
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: ./
          quiet: true
          soft_fail: true
          skip_check: CKV_DOCKER_3,CKV_DOCKER_2

  notify:
    name: Notification
    runs-on: ubuntu-latest
    needs: [security-sast, dependency-check, iac-check]
    if: always()

    steps:
      - name: Rapport de sécurité
        run: |
          echo "=== RAPPORT CI ==="
          echo "SAST: ${{ needs.security-sast.result }}"
          echo "Dépendances: ${{ needs.dependency-check.result }}"
          echo "IaC: ${{ needs.iac-check.result }}"
          echo "=================="
