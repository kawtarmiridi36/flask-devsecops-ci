name: 🚀 CD Pipeline - Build, Scan, Deploy

on:
  push:
    branches: [main]
    # Déclenche aussi sur tags (pour les releases)
    tags: ['v*']

# Permissions nécessaires pour GitHub Packages
permissions:
  contents: read
  packages: write

jobs:
  # JOB 1 : Construire, scanner et pousser l'image
  build-scan-push:
    name: 🐳 Build & Scan Docker Image
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
    
    - name: 🔧 Setup Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: 🐳 Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: 🏗️ Build Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          ghcr.io/${{ github.repository_owner }}/flask-devsecops:latest
          ghcr.io/${{ github.repository_owner }}/flask-devsecops:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
    
    - name: 🔍 Scan Docker image with Trivy
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ghcr.io/${{ github.repository_owner }}/flask-devsecops:${{ github.sha }}
        format: 'table'
        exit-code: '1'
        severity: 'HIGH,CRITICAL'
    
    - name: 🔐 Sign Docker image with Cosign
      if: success()
      uses: sigstore/cosign-installer@main
      continue-on-error: true  # Optionnel pour le moment
      with:
        cosign-release: 'v2.2.0'
    
    - name: 📝 Generate SBOM (Software Bill of Materials)
      uses: anchore/sbom-action@v0
      with:
        image: ghcr.io/${{ github.repository_owner }}/flask-devsecops:${{ github.sha }}
        format: 'spdx'
    
    # JOB 2 : Déployer sur Kubernetes (à configurer plus tard)
  deploy-to-k8s:
    name: ☸️ Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: build-scan-push  # Attendre que l'image soit prête
    if: github.ref == 'refs/heads/main'  # Uniquement sur main
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
    
    - name: ⚠️ Placeholder - Déploiement Kubernetes
      run: |
        echo "✅ Image Docker construite et scannée avec succès!"
        echo "📦 Image: ghcr.io/${{ github.repository_owner }}/flask-devsecops:${{ github.sha }}"
        echo ""
        echo "🚨 ÉTAPES SUIVANTES À CONFIGURER:"
        echo "1. Créer les manifests Kubernetes (deployment.yaml, service.yaml)"
        echo "2. Configurer ArgoCD pour GitOps"
        echo "3. Déployer automatiquement sur cluster Kubernetes"
        echo ""
        echo "📌 Pour le moment: action manuelle nécessaire"
    
    # À COMPLÉTER PLUS TARD:
    # - name: 🔧 Setup kubectl
    #   uses: azure/setup-kubectl@v3
    #   with:
    #     version: 'latest'
    #
    # - name: 🚀 Deploy with kubectl
    #   run: |
    #     kubectl apply -f kubernetes/
    
  # JOB 3 : Notification
  notify:
    name: 📢 Notification
    runs-on: ubuntu-latest
    needs: [build-scan-push, deploy-to-k8s]
    if: always()
    
    steps:
    - name: 📊 CD Pipeline Report
      run: |
        echo "========================================"
        echo "         CD PIPELINE DEVSECOPS         "
        echo "========================================"
        echo "📅 Date: $(date)"
        echo "🔗 Repository: ${{ github.repository }}"
        echo "🔄 Branch: ${{ github.ref }}"
        echo "👤 Triggered by: ${{ github.actor }}"
        echo ""
        echo "📦 Docker Image:"
        echo "   ghcr.io/${{ github.repository_owner }}/flask-devsecops:${{ github.sha }}"
        echo ""
        echo "📊 Résultats:"
        echo "   Build & Scan: ${{ needs.build-scan-push.result }}"
        echo "   Deploy K8s: ${{ needs.deploy-to-k8s.result }}"
        echo "========================================"
