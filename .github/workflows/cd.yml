name: 🚀 CD Pipeline - Build, Scan, Deploy

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  build-scan-push:
    name: 🐳 Build & Scan Docker Image
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
    
    - name: 🔧 Setup Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: 🔐 Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: 🏗️ Build Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          ghcr.io/${{ github.repository_owner }}/flask-devsecops-ci:latest
          ghcr.io/${{ github.repository_owner }}/flask-devsecops-ci:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
    
    - name: 🔍 Scan Docker image with Trivy
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ghcr.io/${{ github.repository_owner }}/flask-devsecops-ci:${{ github.sha }}
        format: 'table'
        exit-code: '1'
        severity: 'HIGH,CRITICAL'
    
    - name: 📝 Generate SBOM
      uses: anchore/sbom-action@v0
      with:
        image: ghcr.io/${{ github.repository_owner }}/flask-devsecops-ci:${{ github.sha }}
        format: 'spdx'

  deploy-to-k8s:
    name: ☸️ Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: build-scan-push
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
    
    - name: ⚠️ Kubernetes Deployment Placeholder
      run: |
        echo "✅ Docker image built and scanned successfully!"
        echo "📦 Image: ghcr.io/${{ github.repository_owner }}/flask-devsecops-ci:${{ github.sha }}"
        echo ""
        echo "🚨 NEXT STEPS TO CONFIGURE:"
        echo "1. Create Kubernetes manifests (deployment.yaml, service.yaml)"
        echo "2. Configure ArgoCD for GitOps"
        echo "3. Deploy to Kubernetes cluster"
        echo ""
        echo "📌 For now: manual deployment required"

  notify:
    name: 📢 Notification
    runs-on: ubuntu-latest
    needs: [build-scan-push, deploy-to-k8s]
    if: always()
    
    steps:
    - name: 📊 CD Pipeline Report
      run: |
        echo "========================================"
        echo "         CD PIPELINE DEVSECOPS         "
        echo "========================================"
        echo "📅 Date: $(date)"
        echo "🔗 Repo: ${{ github.repository }}"
        echo "🔄 Ref: ${{ github.ref }}"
        echo "👤 By: ${{ github.actor }}"
        echo ""
        echo "📦 Docker Image Built:"
        echo "   ghcr.io/${{ github.repository_owner }}/flask-devsecops-ci:${{ github.sha }}"
        echo ""
        echo "📊 Job Results:"
        echo "   Build & Scan: ${{ needs.build-scan-push.result }}"
        echo "   Deploy K8s: ${{ needs.deploy-to-k8s.result }}"
        echo "========================================"
