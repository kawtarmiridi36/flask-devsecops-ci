name: 🚀 Secure CD Pipeline

on:
  push:
    branches: [main]
    tags: ['v*.*.*']

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  security-preflight:
    name: 🔒 Security Pre-flight Checks
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
    
    - name: 🔍 Check for secrets (TruffleHog)
      uses: trufflesecurity/trufflehog@main
      # REMOVED: with: extra_args causing the error
    
    - name: 📋 Validate dependencies
      run: |
        if [ -f requirements.txt ]; then
          echo "Checking for unpinned dependencies..."
          grep -E "^[a-zA-Z]" requirements.txt | grep -v "==" && \
          echo "❌ ERROR: Unpinned dependencies found" && exit 1 || \
          echo "✅ All dependencies are pinned"
        fi
    
    - name: 🐳 Lint Dockerfile
      run: |
        docker run --rm -i hadolint/hadolint < Dockerfile

  build-scan-push:
    name: 🐳 Build & Security Scan
    runs-on: ubuntu-latest
    needs: security-preflight
    
    outputs:
      image-digest: ${{ steps.extract-digest.outputs.digest }}
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
    
    - name: 🔧 Setup Docker Buildx
      uses: docker/setup-buildx-action@v3
      with:
        driver-opts: |
          image=moby/buildkit:master
          network=host
    
    - name: 🔐 Login to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: 🏗️ Build with Security Scanning
      id: build
      uses: docker/build-push-action@v5
      with:
        context: .
        platforms: linux/amd64
        push: true
        tags: |
          ghcr.io/${{ github.repository_owner }}/flask-devsecops-ci:latest
          ghcr.io/${{ github.repository_owner }}/flask-devsecops-ci:${{ github.sha }}
          ghcr.io/${{ github.repository_owner }}/flask-devsecops-ci:${{ github.ref_name }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        provenance: true
        sbom: true
        labels: |
          org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          org.opencontainers.image.revision=${{ github.sha }}
    
    - name: 📝 Extract Image Digest
      id: extract-digest
      run: |
        # Get the exact SHA256 digest
        FULL_DIGEST=$(docker inspect ghcr.io/${{ github.repository_owner }}/flask-devsecops-ci:${{ github.sha }} --format='{{index .RepoDigests 0}}')
        DIGEST_ONLY=$(echo "$FULL_DIGEST" | grep -o '@sha256:[a-f0-9]*' | cut -d'@' -f2)
        echo "digest=$DIGEST_ONLY" >> $GITHUB_OUTPUT
        echo "IMAGE_DIGEST=$DIGEST_ONLY" >> $GITHUB_ENV
        echo "✅ Image digest: $DIGEST_ONLY"
    
    - name: 🔍 Deep Security Scan
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ghcr.io/${{ github.repository_owner }}/flask-devsecops-ci:${{ github.sha }}
        format: sarif
        output: trivy-results.sarif
        exit-code: '1'
        severity: 'CRITICAL'  # Only fail on CRITICAL
        ignore-unfixed: true
        scanners: vuln,secret,config
        vuln-type: os,library
    
    - name: 📤 Upload Security Results
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: trivy-results.sarif
      
    - name: 📦 Generate SBOM
      uses: anchore/sbom-action@v0
      with:
        image: ghcr.io/${{ github.repository_owner }}/flask-devsecops-ci:${{ github.sha }}
        format: 'spdx,cyclonedx'
        output: 'sbom-'

  iac-security-scan:
    name: 🏗️ IaC Security Scan
    runs-on: ubuntu-latest
    needs: [security-preflight, build-scan-push]
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
    
    - name: 🖼️ Update Deployment with Digest BEFORE Checkov
      run: |
        # Update deployment.yaml with the digest from previous job
        if [ -n "${{ needs.build-scan-push.outputs.image-digest }}" ]; then
          IMAGE="ghcr.io/${{ github.repository_owner }}/flask-devsecops-ci@${{ needs.build-scan-push.outputs.image-digest }}"
          echo "📝 Updating deployment with digest: $IMAGE"
          
          # Use sed to update the image (simpler than yq)
          sed -i "s|image:.*|image: $IMAGE|" kubernetes/deployment.yaml
          
          echo "✅ Updated deployment.yaml:"
          grep 'image:' kubernetes/deployment.yaml
        else
          echo "⚠️ No digest available, using tag"
        fi
    
    - name: 🛡️ Checkov for IaC
      uses: bridgecrewio/checkov-action@v12
      with:
        directory: ./
        skip_check: CKV_K8S_43  # Skip digest check since we're updating it dynamically
    
    - name: 🧪 Validate Kubernetes Manifests
      run: |
        echo "🔍 Validating Kubernetes manifests..."
        
        # Check all YAML files are valid
        for file in kubernetes/*.yaml; do
          echo "Validating $file"
          kubectl apply --dry-run=client -f "$file" || echo "❌ Validation failed for $file"
        done
        
        # Verify namespace is production
        echo ""
        echo "📋 Namespace verification:"
        grep -h "namespace:" kubernetes/*.yaml | sort | uniq
        
        # Verify image uses digest
        echo ""
        echo "🖼️ Image verification:"
        if grep -q "@sha256:" kubernetes/deployment.yaml; then
          echo "✅ Image uses SHA256 digest"
        else
          echo "⚠️ Image does not use SHA256 digest"
          grep 'image:' kubernetes/deployment.yaml
        fi

  deploy:
    name: ☸️ Secure Deployment
    runs-on: ubuntu-latest
    needs: [build-scan-push, iac-security-scan]  # Wait for IaC scan
    if: github.ref == 'refs/heads/main'
    
    environment: production
    permissions:
      contents: read
      packages: write
      deployments: write
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
    
    - name: 🔧 Setup Kubernetes
      uses: azure/setup-kubectl@v3
      with:
        version: 'latest'
    
    - name: 🔐 Configure Kubernetes
      id: kubeconfig
      run: |
        if [ -n "${{ secrets.KUBE_CONFIG }}" ]; then
          echo "🔐 KUBE_CONFIG secret found"
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config 2>/dev/null || \
          echo "${{ secrets.KUBE_CONFIG }}" > ~/.kube/config
          kubectl config current-context
          kubectl cluster-info
          echo "✅ Kubernetes configured"
          echo "::set-output name=configured::true"
        else
          echo "⚠️ KUBE_CONFIG secret not configured"
          echo "💡 Add KUBE_CONFIG secret to enable deployment"
          echo "::set-output name=configured::false"
        fi
    
    - name: 🖼️ Final Image Update
      if: steps.kubeconfig.outputs.configured == 'true'
      run: |
        # Use the digest from the build job
        IMAGE="ghcr.io/${{ github.repository_owner }}/flask-devsecops-ci@${{ needs.build-scan-push.outputs.image-digest }}"
        echo "🚀 Final deployment image: $IMAGE"
        
        # Update deployment
        sed -i "s|image:.*|image: $IMAGE|" kubernetes/deployment.yaml
    
    - name: 🚀 Deploy to Production
      if: steps.kubeconfig.outputs.configured == 'true'
      run: |
        echo "========================================"
        echo "       DEPLOYING TO PRODUCTION         "
        echo "========================================"
        
        # Create namespace if not exists
        kubectl create namespace production --dry-run=client -o yaml | kubectl apply -f -
        
        # Label the namespace
        kubectl label namespace production name=production --overwrite
        
        # Apply all Kubernetes manifests
        echo "📋 Applying manifests..."
        kubectl apply -f kubernetes/ --namespace=production
        
        # Wait for rollout
        echo ""
        echo "⏳ Waiting for deployment rollout..."
        kubectl rollout status deployment/flask-devsecops -n production --timeout=300s
        
        echo ""
        echo "✅ Deployment complete!"
        echo ""
        echo "📊 Current status:"
        kubectl get all -n production -l app=flask-devsecops
        
        echo ""
        echo "🔍 Pod details:"
        kubectl get pods -n production -l app=flask-devsecops -o wide
    
    - name: ⏭️ Skip Deployment (No Kubeconfig)
      if: steps.kubeconfig.outputs.configured == 'false'
      run: |
        echo "========================================"
        echo "         DEPLOYMENT SKIPPED            "
        echo "========================================"
        echo "ℹ️ No KUBE_CONFIG secret configured"
        echo ""
        echo "📦 Your secure image is ready:"
        echo "   ghcr.io/${{ github.repository_owner }}/flask-devsecops-ci@${{ needs.build-scan-push.outputs.image-digest }}"
        echo ""
        echo "🔐 To enable deployment:"
        echo "   1. Go to Repository Settings → Secrets → Actions"
        echo "   2. Add KUBE_CONFIG secret"
        echo "   3. Paste base64-encoded kubeconfig"
        echo "========================================"

  audit:
    name: 📊 Security Audit
    runs-on: ubuntu-latest
    needs: [build-scan-push, iac-security-scan, deploy]
    if: always()
    
    steps:
    - name: 📈 Generate Comprehensive Security Report
      run: |
        echo "🔐 SECURITY AUDIT REPORT"
        echo "========================"
        echo "📅 Date: $(date)"
        echo "🔗 Repository: ${{ github.repository }}"
        echo "🔀 Branch: ${{ github.ref_name }}"
        echo "🔑 Commit: ${{ github.sha }}"
        echo "👤 Triggered by: ${{ github.actor }}"
        echo ""
        echo "📊 PIPELINE RESULTS:"
        echo "   🔒 Pre-flight: ${{ needs.security-preflight.result }}"
        echo "   🐳 Build & Scan: ${{ needs.build-scan-push.result }}"
        echo "   🏗️  IaC Security: ${{ needs.iac-security-scan.result }}"
        echo "   ☸️  Deployment: ${{ needs.deploy.result || 'SKIPPED' }}"
        echo ""
        echo "🛡️ SECURITY CHECKS:"
        echo "   ✅ Secrets scanning (TruffleHog)"
        echo "   ✅ Dockerfile linting (Hadolint)"
        echo "   ✅ Container scanning (Trivy)"
        echo "   ✅ IaC scanning (Checkov)"
        echo "   ✅ SBOM generation"
        echo ""
        echo "📦 DEPLOYMENT DETAILS:"
        if [ "${{ needs.deploy.result }}" = "success" ]; then
          echo "   ✅ Successfully deployed to production"
          echo "   🔗 Image: ghcr.io/${{ github.repository_owner }}/flask-devsecops-ci@${{ needs.build-scan-push.outputs.image-digest }}"
          echo "   🏷️  Namespace: production"
        elif [ "${{ needs.deploy.result }}" = "failure" ]; then
          echo "   ❌ Deployment failed"
          echo "   🔧 Check KUBE_CONFIG secret and cluster access"
        else
          echo "   ⏭️  Deployment skipped (no KUBE_CONFIG)"
          echo "   💡 Add KUBE_CONFIG secret to enable auto-deployment"
        fi
        echo ""
        echo "🎯 RECOMMENDATIONS:"
        echo "   1. Review Trivy scan results in Security tab"
        echo "   2. Monitor application logs"
        echo "   3. Set up alerts for security findings"
        echo "   4. Regular dependency updates"
        echo "========================"
