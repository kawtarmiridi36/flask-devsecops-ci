name: 🚀 CD Pipeline - Build, Scan, Deploy

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  build-scan-push:
    name: 🐳 Build & Scan Docker Image
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
    
    - name: 🔧 Setup Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: 🔐 Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: 🏗️ Build Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          ghcr.io/${{ github.repository_owner }}/flask-devsecops-ci:latest
          ghcr.io/${{ github.repository_owner }}/flask-devsecops-ci:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
    
    - name: 🔍 Scan Docker image with Trivy
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ghcr.io/${{ github.repository_owner }}/flask-devsecops-ci:${{ github.sha }}
        format: 'table'
        exit-code: '1'
        severity: 'HIGH,CRITICAL'
    
    - name: 📝 Generate SBOM
      uses: anchore/sbom-action@v0
      with:
        image: ghcr.io/${{ github.repository_owner }}/flask-devsecops-ci:${{ github.sha }}
        format: 'spdx'

  deploy-to-k8s:
    name: ☸️ Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: build-scan-push
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
    
    - name: 📦 Verify Kubernetes Manifests
      run: |
        echo "✅ Kubernetes manifests verification"
        if [ -d "kubernetes" ]; then
          echo "📁 Found kubernetes/ directory"
          find kubernetes/ -name "*.yaml" -o -name "*.yml" | wc -l | xargs echo "📄 YAML files found:"
        else
          echo "⚠️ kubernetes/ directory not found"
          echo "📌 Create basic manifests:"
          echo "mkdir -p kubernetes"
          echo "# Add deployment.yaml, service.yaml, etc."
        fi
    
    - name: 🚀 Simulated Deployment
      run: |
        echo "========================================"
        echo "       KUBERNETES DEPLOYMENT SIMULATION"
        echo "========================================"
        echo "📦 Image ready: ghcr.io/${{ github.repository_owner }}/flask-devsecops-ci:${{ github.sha }}"
        echo ""
        echo "📋 Next steps for REAL deployment:"
        echo "1. Set up kubectl: azure/setup-kubectl@v3"
        echo "2. Configure kubeconfig via GitHub Secrets"
        echo "3. Add step: kubectl apply -f kubernetes/"
        echo "4. Add ArgoCD for GitOps"
        echo ""
        echo "📌 For now, manifests are in: kubernetes/"
        echo "========================================"
  notify:
    name: 📢 Notification
    runs-on: ubuntu-latest
    needs: [build-scan-push, deploy-to-k8s]
    if: always()
    
    steps:
    - name: 📊 CD Pipeline Report
      run: |
        echo "========================================"
        echo "         CD PIPELINE DEVSECOPS         "
        echo "========================================"
        echo "📅 Date: $(date)"
        echo "🔗 Repo: ${{ github.repository }}"
        echo "🔄 Ref: ${{ github.ref }}"
        echo "👤 By: ${{ github.actor }}"
        echo ""
        echo "📦 Docker Image Built:"
        echo "   ghcr.io/${{ github.repository_owner }}/flask-devsecops-ci:${{ github.sha }}"
        echo ""
        echo "📊 Job Results:"
        echo "   Build & Scan: ${{ needs.build-scan-push.result }}"
        echo "   Deploy K8s: ${{ needs.deploy-to-k8s.result }}"
        echo "========================================"
