soft-fail: false
skip-check:
  # Terraform checks
  - CKV_AWS_18  # S3 logging
  - CKV_AWS_19  # S3 encryption
  - CKV_AWS_20  # S3 public ACL
  - CKV_AWS_21  # S3 versioning
  - CKV_AWS_144  # S3 cross-region replication
  - CKV_AWS_145  # S3 bucket encryption
  
  # Docker checks
  - CKV_DOCKER_2  # Non-root user
  - CKV_DOCKER_3  # WORKDIR absolu
  - CKV_DOCKER_4  # Package update
  
quiet: true
framework:
  - dockerfile
  - terraform
