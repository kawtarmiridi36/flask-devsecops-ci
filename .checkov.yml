soft-fail: false
skip-check:
  # Temporarily skip for testing
  - CKV_DOCKER_3  # WORKDIR absolu
  - CKV_DOCKER_7  # HEALTHCHECK
quiet: false
framework:
  - dockerfile
  - gitlab_configuration
  - github_configuration
  - bitbucket_configuration
  - bitbucket_pipelines
  - circleci_pipelines
  - kustomize
  - kubernetes
  - helm
  - terraform
  - secrets
  - openapi
  - sca_package
  - all
external-checks-dir:
  - .external_checkov_checks
download-external-modules: true
evaluate-variables: true
output:
  - cli
  - json
  - junitxml
  - github_failed_only
  - sarif
