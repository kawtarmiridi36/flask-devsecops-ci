apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-devsecops
  namespace: production  # Changed from "default"
  labels:
    app: flask-devsecops
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flask-devsecops
  template:
    metadata:
      labels:
        app: flask-devsecops
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: flask-app
        # This will be replaced by CI/CD with the actual digest
        image: ghcr.io/kawtarmiridi36/flask-devsecops-ci:PLACEHOLDER
        imagePullPolicy: Always
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
              - NET_RAW
          runAsNonRoot: true
          runAsUser: 10001
        ports:
        - containerPort: 5000
          name: http
        env:
        - name: FLASK_ENV
          value: "production"
        - name: FLASK_APP
          value: "app.py"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 5
        volumeMounts:
        - name: tmp-volume
          mountPath: /tmp
      volumes:
      - name: tmp-volume
        emptyDir: {}
