k# kubernetes/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-test
  namespace: production
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flask-test
  template:
    metadata:
      labels:
        app: flask-test
      # 🔧 ADD PROMETHEUS ANNOTATIONS HERE
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "5000"
        prometheus.io/path: "/metrics"
        prometheus.io/scheme: "http"
    spec:
      containers:
      - name: test
        image: $IMAGE_REGISTRY/$IMAGE_NAME:PLACEHOLDER
        imagePullPolicy: Never
        command: ["sh", "-c"]
        args:
          - |
            echo "Testing if image works..."
            which gunicorn && echo "Gunicorn found"
            pip list | grep gunicorn
            python -c "from run import app; print('App import successful')"
            echo "Starting gunicorn..."
            exec gunicorn --bind 0.0.0.0:5000 run:app --workers 2 --timeout 120 --access-logfile -
        ports:
        - containerPort: 5000
        # 🔧 OPTIONAL: Add readiness/liveness probes for metrics
        readinessProbe:
          httpGet:
            path: /metrics
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
