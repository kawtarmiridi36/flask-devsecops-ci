apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-devsecops
  namespace: default
  labels:
    app: flask-devsecops
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flask-devsecops
  template:
    metadata:
      labels:
        app: flask-devsecops
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
      - name: flask-app
        image: ghcr.io/kawtarmiridi36/flask-devsecops-ci:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 5000
          name: http
        env:
        - name: FLASK_ENV
          value: "production"
        - name: FLASK_APP
          value: "app.py"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 5
