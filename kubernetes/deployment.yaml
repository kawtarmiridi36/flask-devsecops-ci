# test-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-test
  namespace: production
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flask-test
  template:
    metadata:
      labels:
        app: flask-test
    spec:
      containers:
      - name: test
        image: flask-devsecops-ci:latest
        imagePullPolicy: Never
        command: ["sh", "-c"]
        args:
          - |
            echo "Testing if image works..."
            which gunicorn && echo "Gunicorn found"
            pip list | grep gunicorn
            python -c "from run import app; print('App import successful')"
            echo "Starting gunicorn..."
            exec gunicorn --bind 0.0.0.0:5000 run:app --workers 2 --timeout 120 --access-logfile -
        ports:
        - containerPort: 5000
