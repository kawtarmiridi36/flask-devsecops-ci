apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: flask-devsecops-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/kawtarmiridi36/flask-devsecops-ci.git
    targetRevision: main
    path: kubernetes
  destination:
    server: https://kubernetes.default.svc
    namespace: production
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
