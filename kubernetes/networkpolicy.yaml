apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: flask-devsecops-netpolicy
spec:
  podSelector:
    matchLabels:
      app: flask-devsecops
  policyTypes:
  - Ingress
  - Egress

  ingress:
  - {}   # allow all for now

  egress:
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0
    ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 80
